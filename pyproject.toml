[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-reliability-lab"
version = "0.1.0"
description = "A deterministic lab for testing RAG citations, groundedness, and hallucination detection."
requires-python = ">=3.11"
authors = [{ name = "Ruban Chakravarthi" }]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
rag-reliability-demo = "rag_reliability_lab.demo:main"
